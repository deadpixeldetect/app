<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pendientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9eef3; --panel: #ffffff; --ink: #14213d; --muted: #5d6b82;
    --accent: #2563eb; --line: #d3dbe6; --done: #8a97ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    display: grid; place-items: start center; padding: 6vh 1rem;
  }
  main { width: min(560px, 100%); }
  h1 { font-size: clamp(2.4rem, 8vw, 3.6rem); font-weight: 800; letter-spacing: -0.03em; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.5rem; color: var(--muted); }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type=text] {
    flex: 1; font: inherit; padding: .8rem 1rem; border: 2px solid var(--line);
    border-radius: 10px; background: var(--panel); color: var(--ink);
  }
  button {
    font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 10px;
    padding: .8rem 1.2rem; background: var(--accent); color: #fff;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--panel); border-radius: 14px; border: 1px solid var(--line); }
  li { display: flex; align-items: center; gap: .8rem; padding: .85rem 1rem; border-bottom: 1px solid var(--line); }
  li:last-child { border-bottom: 0; }
  li input { width: 1.2rem; height: 1.2rem; accent-color: var(--accent); }
  li span { flex: 1; overflow-wrap: anywhere; }
  li.done span { color: var(--done); text-decoration: line-through; }
  li button { background: none; color: var(--muted); padding: .3rem .6rem; font-weight: 400; }
  li button:hover { color: #b91c1c; }
  .msg { padding: 1.5rem 1rem; text-align: center; color: var(--muted); }
  .error { color: #b91c1c; margin-top: .75rem; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <h1>Pendientes</h1>
  <p class="sub">Frontend estático + API serverless en Vercel.</p>
  <form id="form">
    <input id="text" type="text" placeholder="¿Qué tienes que hacer?" maxlength="200" aria-label="Nueva tarea" required>
    <button type="submit">Agregar tarea</button>
  </form>
  <ul id="list" aria-live="polite"></ul>
  <div class="error" id="error" role="alert"></div>
</main>
<script>
  const list = document.getElementById("list");
  const form = document.getElementById("form");
  const input = document.getElementById("text");
  const errorBox = document.getElementById("error");

  async function api(url, options) {
    const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "Error del servidor.");
    return res.status === 204 ? null : res.json();
  }

  function render(tasks) {
    list.innerHTML = "";
    if (!tasks.length) {
      list.innerHTML = '<li class="msg">Sin tareas. Agrega la primera arriba.</li>';
      return;
    }
    for (const t of tasks) {
      const li = document.createElement("li");
      li.className = t.done ? "done" : "";
      const cb = Object.assign(document.createElement("input"), { type: "checkbox", checked: t.done });
      cb.setAttribute("aria-label", "Completar: " + t.text);
      cb.onchange = () => run(() => api("/api/tasks?id=" + t.id, { method: "PATCH", body: JSON.stringify({ done: cb.checked }) }));
      const span = document.createElement("span");
      span.textContent = t.text;
      const del = document.createElement("button");
      del.textContent = "Eliminar";
      del.onclick = () => run(() => api("/api/tasks?id=" + t.id, { method: "DELETE" }));
      li.append(cb, span, del);
      list.append(li);
    }
  }

  async function load() { render(await api("/api/tasks")); }

  async function run(action) {
    errorBox.textContent = "";
    try { await action(); await load(); }
    catch (e) { errorBox.textContent = e.message; }
  }

  form.onsubmit = (e) => {
    e.preventDefault();
    run(async () => {
      await api("/api/tasks", { method: "POST", body: JSON.stringify({ text: input.value }) });
      input.value = "";
    });
  };

  run(() => Promise.resolve());
</script>
</body>
</html>
